# rime_ice.custom.yaml
# RimeVim IME 桥接脚本配置补丁
# 使用 @before 0 插入到 processors 列表最前面，确保优先接收按键事件
customization:
  distribution_code_name: Weasel
  distribution_version: 0.17.4
  generator: "manual"
  modified_time: "2026-05-23"
  rime_version: 1.13.1
patch:
  # 插入 RimeVim IME 状态监控 Lua 处理器到 processors 列表最前面
  # 确保在 ascii_composer 之前接收按键事件（如 Caps Lock）
  "engine/processors/@before 0": lua_processor@*rimevim_bridge